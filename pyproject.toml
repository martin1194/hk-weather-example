[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-weather"
version = "0.1.0"
description = "Print current Hong Kong weather from the Hong Kong Observatory open data API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hk-weather-example contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
# Pyflakes and the pycodestyle error codes Ruff enables by default.
# Line length is left alone so existing report strings stay as they are.
select = ["E4", "E7", "E9", "F"]

[project.scripts]
hk-weather = "hk_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
